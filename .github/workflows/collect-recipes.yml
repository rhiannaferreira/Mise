name: Collect recipes
# Weekly, reads new recipe pages from the chefs' sites (politely, following robots.txt)
# and commits the updated public/data/recipes.json. Only titles, times, ratings and links are saved.
on:
  schedule:
    - cron: '17 9 * * 1' # Mondays
  workflow_dispatch:
    inputs:
      max_new:
        description: New recipes to collect per chef site
        default: '25'
permissions:
  contents: write
concurrency: collect-recipes
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/crawl.mjs --max-new "${{ github.event.inputs.max_new || '25' }}"
      - run: node --test test/*.test.mjs
      - name: Commit new recipes
        run: |
          if git diff --quiet public/data/recipes.json; then echo "No changes"; exit 0; fi
          git config user.name "mise-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/recipes.json
          git commit -m "Collect recipes $(date -u +%F)"
          git push
